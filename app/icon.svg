<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#3B82F6"/>
  
  <!-- Lock body -->
  <rect x="35" y="55" width="30" height="25" rx="3" fill="#FFFFFF"/>
  
  <!-- Lock shackle -->
  <path d="M 35 55 Q 35 40, 50 40 Q 65 40, 65 55" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Three dials representing combination -->
  <circle cx="50" cy="67" r="4" fill="#3B82F6"/>
  <circle cx="42" cy="67" r="3" fill="#3B82F6"/>
  <circle cx="58" cy="67" r="3" fill="#3B82F6"/>
</svg>
